[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soundlab"
version = "0.19.0"
description = "Physical-modelling sound engine: excitation -> resonator -> radiation -> propagation -> room, JSON recipes, CLI, analysis-by-synthesis."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Garyck Arntzen" }]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
test = ["pytest>=7"]

[project.scripts]
soundlab = "soundlab.cli:main"

[project.urls]
Author = "https://x.com/_mintydoge"

[tool.setuptools.packages.find]
include = ["soundlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"soundlab.gui" = ["static/*"]
