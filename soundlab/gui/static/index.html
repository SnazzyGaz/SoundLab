<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoundLab</title>
<style>
  :root { --bg:#f6f6f4; --panel:#fff; --ink:#1d1d1f; --mute:#6b6b70; --line:#e2e2df; --acc:#2a62d9; --acc2:#e8eefc; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; color:var(--ink); background:var(--bg); }
  header { display:flex; align-items:center; gap:16px; padding:10px 18px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; font-weight:600; }
  header .sp { flex:1; }
  header a { color:var(--acc); text-decoration:none; }
  .wrap { display:flex; height:calc(100vh - 47px); }
  aside { width:270px; min-width:220px; border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; }
  aside input { margin:10px; padding:7px 9px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  #list { overflow:auto; flex:1; padding-bottom:10px; }
  .cat { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); padding:12px 12px 3px; font-weight:600; }
  .sub { font-size:12px; color:var(--mute); padding:6px 14px 2px; }
  .item { padding:4px 14px 4px 22px; cursor:pointer; border-left:3px solid transparent; }
  .item:hover { background:#f2f2f0; }
  .item.on { background:var(--acc2); border-left-color:var(--acc); }
  .item small { color:var(--mute); }
  main { flex:1; overflow:auto; padding:18px 24px 40px; }
  .empty { color:var(--mute); margin-top:60px; text-align:center; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:14px; }
  .card h3 { margin:0 0 10px; font-size:13px; font-weight:600; color:var(--mute); text-transform:uppercase; letter-spacing:.05em; }
  .top { display:flex; align-items:center; gap:14px; }
  .top h2 { margin:0; font-size:20px; font-weight:600; }
  button { font:inherit; padding:7px 14px; border-radius:6px; border:1px solid var(--line); background:#fff; cursor:pointer; }
  button:hover { border-color:#c7c7c3; }
  button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
  button:disabled { opacity:.5; cursor:default; }
  #play { width:96px; }
  #status { color:var(--mute); font-size:13px; }
  canvas { width:100%; display:block; border-radius:6px; background:#fafaf8; border:1px solid var(--line); }
  #wave { height:110px; margin-bottom:8px; }
  #spec { height:150px; background:#111; }
  .row { display:grid; grid-template-columns:150px 1fr 70px; align-items:center; gap:10px; margin:6px 0; }
  .row label { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row .v { text-align:right; color:var(--mute); font-variant-numeric:tabular-nums; }
  .row select { font:inherit; padding:4px; }
  input[type=range] { width:100%; accent-color:var(--acc); }
  .hint { color:var(--mute); font-size:12px; }
  .inline { display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
  .inline input[type=number], .inline input[type=text] { width:90px; padding:5px 7px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  .inline input[type=text] { width:200px; }
  details summary { cursor:pointer; font-weight:600; color:var(--mute); }
  .blk { margin:12px 0 4px; font-weight:600; }
  .blk span { color:var(--mute); font-weight:400; }
  .row.changed label { color:var(--acc); font-weight:600; }
  #msg { white-space:pre-wrap; font-size:13px; margin-top:8px; color:var(--mute); }
  #msg.err, #smsg.err { color:#b3261e; }
  .tabs button { padding:5px 12px; }
  .tabs button.on { background:var(--acc2); border-color:var(--acc); color:var(--acc); font-weight:600; }
  .addhint { display:none; margin:0 10px 6px; font-size:12px; color:var(--acc); }
  body.seqmode .addhint { display:block; }
  #seqwave { height:120px; }
  .step { border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin:8px 0; background:#fcfcfb; }
  .step .head { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
  .step .head b { min-width:150px; }
  .step .head .n { color:var(--mute); width:22px; }
  .step input[type=number] { width:68px; padding:4px 6px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  .step select { font:inherit; padding:3px; }
  .step button { padding:3px 8px; }
  .step .ctl { margin-top:6px; display:none; }
  .step.open .ctl { display:block; }
  .smsg { white-space:pre-wrap; font-size:13px; margin-top:8px; color:var(--mute); }
</style>
</head>
<body>
<header>
  <h1>SoundLab</h1><span id="ver" class="hint"></span>
  <span class="tabs"><button id="tabsound" class="on">Sounds</button> <button id="tabseq">Sequence</button></span>
  <span class="sp"></span>
  <a href="/blindtest">Blind test</a>
</header>
<div class="wrap">
  <aside>
    <input id="search" type="search" placeholder="Search sounds… (door, gravel, gun)" autocomplete="off">
    <div class="addhint">Click a sound to add it as a step.</div>
    <div id="list"></div>
  </aside>
  <main id="main"><div class="empty">Pick a sound on the left.</div></main>
</div>

<template id="tpl">
  <div class="card">
    <div class="top">
      <button id="play" class="primary">▶ Play</button>
      <div><h2 id="title"></h2><div class="hint" id="sub"></div></div>
      <span class="sp" style="flex:1"></span>
      <label class="inline hint"><input type="checkbox" id="auto" checked> play on slider release</label>
    </div>
    <div style="margin-top:12px"><canvas id="wave" width="1600" height="220"></canvas><canvas id="spec" width="960" height="300"></canvas></div>
    <div id="status" style="margin-top:6px">&nbsp;</div>
  </div>
  <div class="card"><h3>Controls</h3><div id="macros"></div>
    <div class="inline" style="margin-top:12px">
      <span>Variation</span>
      <button id="prev">◀</button><input type="number" id="variation" min="0" value="0"><button id="next">▶</button>
      <button id="dice">🎲 Random</button><button id="reset">Reset all</button>
    </div>
    <p class="hint" style="margin:6px 0 0">0 is the sound as designed; every other number is a different take of the same sound.</p>
  </div>
  <div class="card"><details id="adv"><summary>Advanced</summary>
    <div id="advmacros"></div>
    <p class="hint">Every model control. These set exact values and win over the controls above for the same setting. Changed ones turn blue.</p>
    <div id="advanced"></div></details></div>
  <div class="card"><h3>Export</h3>
    <div class="inline" style="margin-bottom:10px">
      <span>Level</span><select id="level"><option value="lufs">Loudness per category (game-ready)</option><option value="peak">Peak -1 dBFS (raw)</option></select>
      <label class="inline"><input type="checkbox" id="trim" checked> trim silent tail</label>
      <span id="loopbox" class="inline" style="display:none"><label class="inline"><input type="checkbox" id="loopon"> seamless loop</label>
        <input type="number" id="loops" min="1" max="120" step="1" value="10"> s</span>
      <label id="stereobox" class="inline" style="display:none" title="Stereo bed: rain, wind, fire, water... (one-shots stay mono: the game pans them)"><input type="checkbox" id="stereo" checked> stereo</label>
    </div>
    <p class="hint" style="margin-top:0">Play uses the same settings, so what you hear is what gets exported.</p>
    <div class="inline">
      <button id="exp">Export WAV</button>
      <label class="inline"><input type="checkbox" id="mp3"> also MP3 (needs ffmpeg)</label>
      <span style="width:20px"></span>
      <span>Variations</span><input type="number" id="n" min="1" max="100" value="10">
      <button id="batch">Export batch</button>
    </div>
    <div class="inline" style="margin-top:10px">
      <input type="text" id="newname" placeholder="new_recipe_name"><button id="save">Save as new recipe</button>
    </div>
    <div id="msg"></div>
  </div>
</template>

<template id="seqtpl">
  <div class="card">
    <div class="top">
      <button id="splay" class="primary">▶ Play</button>
      <div><h2 id="stitle">Sequence</h2><div class="hint" id="ssub"></div></div>
      <span class="sp" style="flex:1"></span>
      <label class="inline hint"><input type="checkbox" id="sauto" checked> play on change</label>
    </div>
    <div style="margin-top:12px"><canvas id="seqwave" width="1600" height="240"></canvas></div>
    <div id="sstatus" style="margin-top:6px">&nbsp;</div>
  </div>
  <div class="card"><h3>Sequence</h3>
    <div class="inline" style="margin-bottom:8px">
      <span>Start from</span><select id="preset"></select>
      <button id="sclear">Empty</button>
    </div>
    <div class="row"><label>Rate</label><div class="inline"><select id="ratemode"><option value="spm">steps per minute</option><option value="interval">seconds between events</option></select>
      <input type="number" id="rate" min="0.01" step="any"></div><span></span></div>
    <div id="hum"></div>
    <div class="inline" style="margin-top:10px">
      <span>Variation</span>
      <button id="sprev">◀</button><input type="number" id="sseed" min="0" value="1"><button id="snext">▶</button>
      <button id="sdice">🎲 Random</button>
    </div>
    <p class="hint" style="margin:6px 0 0">Every event draws its own take (never the same take twice in a row); Variation picks a different set of takes and jitter.</p>
  </div>
  <div class="card"><h3>Steps</h3>
    <div id="steps"></div>
    <p class="hint">Add a step: click a sound in the library on the left. Start: after the previous step starts (+ s), after it ends (gap s, negative overlaps) or at a fixed time. Blank interval = the rate above.</p>
  </div>
  <div class="card"><h3>Export</h3>
    <div class="inline">
      <span>Level</span><select id="slevel"><option value="lufs">Loudness per category (game-ready)</option><option value="peak">Peak -1 dBFS (raw)</option></select>
      <button id="sexp">Export</button>
      <label class="inline"><input type="checkbox" id="smp3"> also MP3</label>
      <label class="inline"><input type="checkbox" id="sone"> numbered one-shots + cue CSV</label>
    </div>
    <div class="inline" style="margin-top:10px">
      <input type="text" id="sname" placeholder="sequence_name"><button id="ssave">Save sequence</button>
    </div>
    <div id="smsg" class="smsg"></div>
  </div>
</template>

<script>
const $ = (s, el = document) => el.querySelector(s);
let recipes = [], cur = null, state = {}, audio = new Audio(), lastKey = null, busy = 0, pending = false;

async function api(path, body, signal) {
  const r = await fetch(path, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body), signal} : {signal});
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function fmt(v) { return typeof v === "number" ? (Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2)) : v; }

async function init() {
  const info = await api("/api/info");
  $("#ver").textContent = "v" + info.version + " · saves to " + info.out_dir;
  recipes = await api("/api/recipes");
  drawList();
  $("#search").addEventListener("input", drawList);
  $("#tabsound").onclick = () => setMode("sound");
  $("#tabseq").onclick = () => setMode("seq");
  if (location.hash === "#sequence") { setMode("seq"); return; }
  const want = decodeURIComponent(location.hash.slice(1));
  if (want && recipes.some(r => r.id === want)) select(want);     // old (hidden) ids still open by link
}

// The library: Domain › Thing, plain names. Old ids that were merged or replaced stay as hidden aliases (they still
// render and open by link) and are not listed.
const TOP = ["Foley", "Impacts & breaks", "Combat", "Fire", "Water", "Weather", "Machines", "Vehicles", "Animals",
             "Creatures", "Game UI & sci-fi", "My recipes", "Other"];
const SUB = {"Foley": ["Footsteps", "Doors & gates", "Cloth & bags", "Paper & books", "Kitchen & tableware", "Household", "Scrapes & rubs"],
             "Combat": ["Guns", "Blades", "Bows", "Melee", "Explosions"]};
function rank(list, x) { const i = list ? list.indexOf(x) : -1; return i < 0 ? 999 : i; }
function drawList() {
  const words = $("#search").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const shown = recipes.filter(r => !r.hidden && words.every(w =>
    [r.title, r.id, r.library, r.name, ...(r.tags || [])].join(" ").toLowerCase().includes(w)));
  const key = r => { const [top, sub = ""] = (r.library || "Other").split("/"); return [rank(TOP, top), top, rank(SUB[top], sub), sub, r.title.toLowerCase()]; };
  shown.sort((a, b) => { const x = key(a), y = key(b); for (let i = 0; i < x.length; i++) if (x[i] !== y[i]) return x[i] < y[i] ? -1 : 1; return 0; });
  let html = "", lastTop = null, lastSub = null;
  for (const r of shown) {
    const [top, sub = ""] = (r.library || "Other").split("/");
    if (top !== lastTop) { html += `<div class="cat">${esc(top)}</div>`; lastTop = top; lastSub = null; }
    if (sub && sub !== lastSub) { html += `<div class="sub">${esc(sub)}</div>`; lastSub = sub; }
    html += `<div class="item ${cur && cur.id === r.id ? "on" : ""}" data-id="${esc(r.id)}" title="${esc(r.name)}">${esc(r.title)}` +
            ` <small>· ${fmt(r.duration)} s</small></div>`;
  }
  $("#list").innerHTML = html || '<div class="empty">No match.</div>';
  for (const el of document.querySelectorAll(".item")) el.onclick = () => mode === "seq" ? addStep(el.dataset.id) : select(el.dataset.id);
}

async function select(id) {
  if (mode !== "sound") setMode("sound", true);
  cur = await api("/api/recipe?id=" + encodeURIComponent(id));
  location.hash = encodeURIComponent(id);
  state = {macros: {}, overrides: {}, variation: 0};
  const main = $("#main"); main.innerHTML = ""; main.appendChild($("#tpl").content.cloneNode(true));
  $("#title").textContent = cur.title || cur.name;
  $("#sub").textContent = (cur.library ? cur.library.replace("/", " › ") + " · " : "") + cur.name + " · " + cur.duration + " s" +
    (cur.hidden ? " · old id kept so existing files and calls still work" + (cur.replaced_by ? "; the library entry is " + cur.replaced_by : "") : "");
  buildMacros(); buildAdvanced(); wire(); drawList(); render(false);
}

function slider(container, o) {  // o: {label, doc, lo, hi, value, log, onchange, key}
  const row = document.createElement("div"); row.className = "row"; row.title = o.doc || "";
  const toPos = v => o.log ? Math.log(v / o.lo) / Math.log(o.hi / o.lo) : (v - o.lo) / (o.hi - o.lo);
  const fromPos = p => o.log ? o.lo * Math.pow(o.hi / o.lo, p) : o.lo + p * (o.hi - o.lo);
  row.innerHTML = `<label>${esc(o.label)}</label><input type="range" min="0" max="1000" step="1"><span class="v"></span>`;
  const inp = $("input", row), out = $(".v", row);
  inp.value = Math.round(1000 * Math.min(1, Math.max(0, toPos(o.value))));
  out.textContent = fmt(o.value) + (o.unit ? " " + o.unit : "");
  inp.oninput = () => { const v = fromPos(inp.value / 1000); out.textContent = fmt(v) + (o.unit ? " " + o.unit : ""); dragging = true; o.onchange(v, row); dragging = false; };
  inp.onchange = () => { o.onchange(fromPos(inp.value / 1000), row); };
  row.ondblclick = () => { inp.value = Math.round(1000 * toPos(o.value)); out.textContent = fmt(o.value); o.onreset && o.onreset(row); };
  container.appendChild(row); return row;
}
function dropdown(container, label, doc, choices, value, onchange) {
  const row = document.createElement("div"); row.className = "row"; row.title = doc || "";
  row.innerHTML = `<label>${esc(label)}</label><select>${choices.map(c => `<option ${String(c) === String(value) ? "selected" : ""}>${esc(c)}</option>`).join("")}</select><span></span>`;
  $("select", row).onchange = e => onchange(e.target.value, row);
  container.appendChild(row); return row;
}

function buildMacros() {
  // front: the few plain controls; Advanced: the rest that still do something; hidden: aliases and the old seed slider
  const front = cur.macros.filter(m => (m.ui || "front") === "front"), adv = cur.macros.filter(m => m.ui === "advanced");
  const box = $("#macros");
  if (!front.length) box.innerHTML = '<p class="hint">' + (adv.length ? "Fine controls are under Advanced below." : "No controls; use Advanced below.") + "</p>";
  for (const m of front) macroControl(box, m);
  for (const m of adv) macroControl($("#advmacros"), m);
}
function macroControl(box, m) {
  const label = m.label || m.name;
  if (m.choices) dropdown(box, label, m.doc, m.choices, m.default, v => { state.macros[m.name] = v; changed(); });
  else if (m.options) dropdown(box, label, m.doc, m.options, m.default_label ?? m.options[0], v => {
    if (v === m.default_label) delete state.macros[m.name]; else state.macros[m.name] = v; changed(); });
  else slider(box, {label, doc: m.doc + " (double-click to reset)", lo: 0, hi: 1, value: m.default,
                    onchange: v => { state.macros[m.name] = +v.toFixed(3); changed(); },
                    onreset: () => { delete state.macros[m.name]; changed(); }});
}

function buildAdvanced() {
  const box = $("#advanced");
  for (const b of cur.advanced) {
    if (!b.controls.length) continue;
    const h = document.createElement("div"); h.className = "blk";
    h.innerHTML = `${esc(b.layer)} <span>· ${esc(b.model)}</span>`; box.appendChild(h);
    for (const c of b.controls) {
      const set = (v, row) => { state.overrides[c.key] = v; row.classList.add("changed"); changed(); };
      const doc = (c.doc || "") + (c.unit ? ` [${c.unit}]` : "");
      if (c.kind === "choice") dropdown(box, c.name, doc, c.choices, c.value, set);
      else if (c.kind === "bool") dropdown(box, c.name, doc, ["true", "false"], String(c.value), (v, row) => set(v === "true", row));
      else if (c.kind === "number") {
        const isInt = Number.isInteger(c.value) && Number.isInteger(c.lo) && Number.isInteger(c.hi) && c.hi - c.lo <= 64;
        slider(box, {label: c.name, doc: doc + " (double-click to undo)", lo: c.lo, hi: c.hi, value: c.value, log: c.log, unit: c.unit,
                     onchange: (v, row) => set(isInt ? Math.round(v) : +v.toPrecision(4), row),
                     onreset: row => { delete state.overrides[c.key]; row.classList.remove("changed"); changed(); }});
      } else {
        const row = document.createElement("div"); row.className = "row"; row.title = doc;
        row.innerHTML = `<label>${esc(c.name)}</label><span class="hint">${esc(c.value)}</span><span></span>`; box.appendChild(row);
      }
    }
  }
}

function wire() {
  $("#play").onclick = () => { if (audio.src && lastKey && !pending) { audio.currentTime = 0; audio.play(); } else render(true); };
  $("#variation").onchange = e => { state.variation = Math.max(0, Math.round(+e.target.value) || 0); $("#variation").value = state.variation; changed(); };
  $("#prev").onclick = () => { $("#variation").value = state.variation = Math.max(0, state.variation - 1); changed(); };
  $("#next").onclick = () => { $("#variation").value = ++state.variation; changed(); };
  $("#dice").onclick = () => { $("#variation").value = state.variation = 1 + Math.floor(Math.random() * 9999); changed(); };
  $("#reset").onclick = () => select(cur.id);
  $("#loopbox").style.display = cur.loopable ? "" : "none";
  $("#stereobox").style.display = cur.stereo ? "" : "none";
  for (const id of ["#level", "#trim", "#loopon", "#loops", "#stereo"]) $(id).onchange = changed;
  $("#exp").onclick = () => run("/api/export", {...req(), mp3: $("#mp3").checked}, r => "Saved " + r.wav + (r.mp3 ? "\n      " + r.mp3 : "") + (r.mp3_error ? "\nMP3 skipped: " + r.mp3_error : ""));
  $("#batch").onclick = () => run("/api/batch", {...req(), n: +$("#n").value || 10, mp3: $("#mp3").checked},
                                  r => `Saved ${r.files.length} variations in ${r.folder}` + (r.files.some(f => f.mp3_error) ? "\nMP3 skipped (ffmpeg not found)" : ""));
  $("#save").onclick = () => run("/api/save", {...req(), name: $("#newname").value}, r => { reloadList(r.id); return "Saved recipe " + r.path; });
}

function req() {
  const loop = cur.loopable && $("#loopon").checked ? Math.max(1, +$("#loops").value || 10) : 0;
  return {id: cur.id, macros: state.macros, overrides: state.overrides, variation: state.variation,
          level: $("#level").value, trim: $("#trim").checked, loop,
          stereo: cur.stereo ? $("#stereo").checked : false};
}
// Slider moves render live: a short debounce, the previous request is aborted and the server drops any render a newer
// one has replaced. While dragging the picture updates; letting go (or any other change) plays the result.
let dragging = false, debounce = null, wantPlay = false;
function changed() {
  pending = true;
  if (!$("#auto").checked) { $("#status").textContent = "changed: press Play"; return; }
  wantPlay = wantPlay || !dragging;
  clearTimeout(debounce);
  debounce = setTimeout(() => { const p = wantPlay; wantPlay = false; render(p); }, 60);
}

async function run(path, body, done) {
  const msg = $("#msg"); msg.className = ""; msg.textContent = "Working…";
  for (const b of document.querySelectorAll("button")) b.disabled = true;
  try { msg.textContent = done(await api(path, body)); }
  catch (e) { msg.className = "err"; msg.textContent = e.message; }
  finally { for (const b of document.querySelectorAll("button")) b.disabled = false; }
}
async function reloadList(id) { recipes = await api("/api/recipes"); drawList(); }

let seq = 0, inflight = null;
async function render(play) {
  const my = ++seq; $("#status").textContent = "rendering…"; $("#play").disabled = true;
  clearTimeout(debounce);
  if (inflight) inflight.abort();     // the server stops a render a newer one replaces
  const ctl = inflight = new AbortController();
  try {
    const r = await api("/api/render", {...req(), supersede: true}, ctl.signal);
    if (my !== seq || r.superseded) return;           // a newer render is on its way
    lastKey = r.key; pending = false;
    audio.src = r.url; audio.loop = !!req().loop;   // loops play round so the seam can be heard
    const f = r.finish || {};
    const lvl = f.result !== undefined ? ` · ${f.result} LUFS${f.measured_by === "integrated" ? " integrated" : " (max momentary)"}, target ${f.target}` +
                (f.limiter_db ? ` · limited ${f.limiter_db} dB` : "") : "";
    $("#status").textContent = `${r.seconds.toFixed(2)} s${req().loop ? " loop" : ""}${r.channels === 2 ? " stereo" : ""} · rendered in ${r.render_s} s · peak ${(20 * Math.log10(r.peak + 1e-9)).toFixed(1)} dBFS${lvl}`;
    drawWave(r.waveform); drawSpec(r.spectrogram);
    if (play) audio.play().catch(() => {});
  } catch (e) { if (my === seq && e.name !== "AbortError") $("#status").textContent = "error: " + e.message; }
  finally { if (my === seq) { $("#play").disabled = false; inflight = null; } }
}

function drawWave(bins) {
  const c = $("#wave"), g = c.getContext("2d"), W = c.width, H = c.height;
  g.clearRect(0, 0, W, H); g.strokeStyle = "#e2e2df"; g.beginPath(); g.moveTo(0, H / 2); g.lineTo(W, H / 2); g.stroke();
  g.fillStyle = "#2a62d9"; const w = W / bins.length;
  bins.forEach(([lo, hi], i) => { const y1 = H / 2 - hi * H / 2, y2 = H / 2 - lo * H / 2; g.fillRect(i * w, y1, Math.max(1, w), Math.max(1, y2 - y1)); });
}
function drawSpec(s) {
  const c = $("#spec"), g = c.getContext("2d"), raw = atob(s.data), img = g.createImageData(s.frames, s.bands);
  for (let f = 0; f < s.frames; f++) for (let b = 0; b < s.bands; b++) {
    const v = raw.charCodeAt(f * s.bands + b) / 255, i = ((s.bands - 1 - b) * s.frames + f) * 4;
    img.data[i] = Math.min(255, 255 * Math.min(1, v * 1.6)); img.data[i + 1] = 255 * Math.max(0, v * 1.6 - 0.6); img.data[i + 2] = 255 * Math.max(0, Math.min(1, v < 0.4 ? v * 1.8 : 1.6 - v * 1.5)); img.data[i + 3] = 255;
  }
  const tmp = document.createElement("canvas"); tmp.width = s.frames; tmp.height = s.bands; tmp.getContext("2d").putImageData(img, 0, 0);
  g.imageSmoothingEnabled = true; g.clearRect(0, 0, c.width, c.height); g.drawImage(tmp, 0, 0, c.width, c.height);
  g.fillStyle = "rgba(255,255,255,.6)"; g.font = "20px Segoe UI, sans-serif";
  g.fillText(Math.round(s.fmax / 1000) + " kHz", 8, 24); g.fillText(s.fmin + " Hz", 8, c.height - 8);
}

// ------------------------------------------------------------------ Sequence: library entries on a timeline
// Every change re-renders with the same debounce / abort / supersede as the sliders. The server keeps each event's
// audio, so timing, gain, pan and jitter changes only re-mix; a new step or new settings render just those events.
let mode = "sound", S = null, presetsList = [], described = {}, sqn = 0, sinflight = null, sdebounce = null, sPending = true, sLast = null;
async function setMode(m, quiet) {
  mode = m; document.body.classList.toggle("seqmode", m === "seq");
  $("#tabsound").classList.toggle("on", m === "sound"); $("#tabseq").classList.toggle("on", m === "seq");
  if (quiet) return;
  if (m === "seq") { location.hash = "sequence"; await openSequence(); }
  else { drawList(); if (cur) select(cur.id); else $("#main").innerHTML = '<div class="empty">Pick a sound on the left.</div>'; }
}
async function describe(id) { return described[id] || (described[id] = await api("/api/recipe?id=" + encodeURIComponent(id))); }
async function openSequence() {
  const main = $("#main"); main.innerHTML = ""; main.appendChild($("#seqtpl").content.cloneNode(true));
  presetsList = await api("/api/sequences");
  $("#preset").innerHTML = presetsList.map((p, i) => `<option value="${i}">${esc(p.title)}${p.user ? " (mine)" : ""}</option>`).join("");
  $("#preset").onchange = () => loadPreset(+$("#preset").value);
  $("#sclear").onclick = () => { S = {soundlab: 1, type: "sequence", name: "my_sequence", title: "My sequence", category: "sfx", seed: 1,
                                     rate: {interval: 0.5}, humanise: {timing_ms: 0, level_db: 0, alternate: 0}, steps: []}; drawSeq(); };
  $("#ratemode").onchange = () => { const v = +$("#rate").value || 1; S.rate = $("#ratemode").value === "spm" ? {spm: S.rate.interval ? Math.round(60 / S.rate.interval) : v} : {interval: S.rate.spm ? +(60 / S.rate.spm).toFixed(3) : v}; drawGlobals(); schanged(); };
  $("#rate").oninput = () => { const v = +$("#rate").value; if (v > 0) { S.rate = {[$("#ratemode").value]: v}; schanged(); } };
  $("#sseed").onchange = e => { S.seed = Math.max(0, Math.round(+e.target.value) || 0); $("#sseed").value = S.seed; schanged(); };
  $("#sprev").onclick = () => { $("#sseed").value = S.seed = Math.max(0, S.seed - 1); schanged(); };
  $("#snext").onclick = () => { $("#sseed").value = ++S.seed; schanged(); };
  $("#sdice").onclick = () => { $("#sseed").value = S.seed = 1 + Math.floor(Math.random() * 9999); schanged(); };
  $("#slevel").onchange = schanged;
  $("#splay").onclick = () => { if (audio.src && sLast && !sPending) { audio.currentTime = 0; audio.play(); } else srender(true); };
  $("#sexp").onclick = () => srun("/api/sequence/export", {sequence: S, level: $("#slevel").value, mp3: $("#smp3").checked, oneshots: $("#sone").checked},
    r => "Saved " + r.wav + (r.mp3 ? "\n      " + r.mp3 : "") + (r.mp3_error ? "\nMP3 skipped: " + r.mp3_error : "") + (r.oneshots ? `\n${r.events} one-shots + cues.csv in ${r.oneshots}` : ""));
  $("#ssave").onclick = () => srun("/api/sequence/save", {sequence: S, name: $("#sname").value}, r => "Saved sequence " + r.path);
  if (S) drawSeq(); else loadPreset(0);
}
function loadPreset(i) {
  const p = presetsList[i]; if (!p) return;
  S = JSON.parse(JSON.stringify(p.sequence)); S.humanise = Object.assign({timing_ms: 0, level_db: 0, alternate: 0}, S.humanise || {});
  if (!S.rate) S.rate = {interval: 0.5};
  $("#preset").value = i; drawSeq();
}
function drawGlobals() {
  const mode_ = S.rate.spm ? "spm" : "interval"; $("#ratemode").value = mode_; $("#rate").value = S.rate[mode_];
  $("#sseed").value = S.seed ?? 1; $("#slevel").value = S.level || "lufs";
  const hum = $("#hum"); hum.innerHTML = "";
  const H = S.humanise;
  slider(hum, {label: "Timing jitter", doc: "each event moves by up to ± this many milliseconds (double-click: 0)", lo: 0, hi: 80, value: H.timing_ms || 0, unit: "ms",
               onchange: v => { H.timing_ms = Math.round(v); schanged(); }, onreset: () => { H.timing_ms = 0; drawGlobals(); schanged(); }});
  slider(hum, {label: "Level jitter", doc: "each event's level moves by up to ± this many dB (double-click: 0)", lo: 0, hi: 6, value: H.level_db || 0, unit: "dB",
               onchange: v => { H.level_db = +v.toFixed(2); schanged(); }, onreset: () => { H.level_db = 0; drawGlobals(); schanged(); }});
  slider(hum, {label: "Left / right", doc: "footsteps (and steps set to alternate) swing left and right by this much (double-click: 0)", lo: 0, hi: 1, value: H.alternate || 0,
               onchange: v => { H.alternate = +v.toFixed(2); schanged(); }, onreset: () => { H.alternate = 0; drawGlobals(); schanged(); }});
}
function drawSeq() {
  $("#stitle").textContent = S.title || S.name || "Sequence"; $("#ssub").textContent = S.doc || "";
  drawGlobals(); drawSteps(); schanged(true);
}
async function addStep(id) {
  const d = await describe(id);
  if (!S.steps.length) { S.category = d.category || "sfx"; if (S.name === "my_sequence") S.title = d.title + " sequence"; }
  S.steps.push(S.steps.length ? {entry: id, gap: 0.2} : {entry: id});
  drawSteps(); schanged(true);
}
function startOf(st) { return "at" in st ? "at" : "gap" in st ? "gap" : "offset"; }
function drawSteps() {
  const box = $("#steps"); box.innerHTML = "";
  if (!S.steps.length) box.innerHTML = '<p class="hint">No steps yet.</p>';
  S.steps.forEach((st, i) => {
    const el = document.createElement("div"); el.className = "step";
    const sm = startOf(st), sv = st[sm] ?? "";
    el.innerHTML = `<div class="head"><span class="n">${i + 1}</span><b>${esc(st.entry)}</b>
      <span>start</span><select class="sm"><option value="offset">after previous starts +</option><option value="gap">after previous ends, gap</option><option value="at">at</option></select>
      <input type="number" class="sv" step="0.01" placeholder="rate" value="${sv}"> s
      <span>×</span><input type="number" class="rep" min="1" max="256" step="1" value="${st.repeat || 1}">
      <span>every</span><input type="number" class="iv" min="0.01" step="0.01" placeholder="rate" value="${st.interval ?? ""}"> s
      <span>gain</span><input type="number" class="g" step="0.5" value="${st.gain_db || 0}"> dB
      <span>pan</span><input type="number" class="pan" min="-1" max="1" step="0.05" value="${st.pan || 0}">
      <span>take</span><input type="number" class="take" min="0" step="1" placeholder="auto" value="${st.take === undefined || st.take === "auto" ? "" : st.take}">
      <button class="set" title="this step's controls">⚙</button><button class="up" title="move up">↑</button><button class="dn" title="move down">↓</button><button class="rm" title="remove">✕</button></div>
      <div class="ctl"></div>`;
    $(".sm", el).value = sm;
    describe(st.entry).then(d => { $("b", el).textContent = d.title || d.name; $("b", el).title = st.entry; });
    const num = (sel, key, opt = {}) => { $(sel, el).oninput = e => { const v = e.target.value.trim();
      if (v === "" || isNaN(+v)) { if (opt.blank) delete st[key]; else return; } else st[key] = opt.int ? Math.max(1, Math.round(+v)) : +v;
      schanged(); }; };
    num(".rep", "repeat", {int: true}); num(".iv", "interval", {blank: true}); num(".g", "gain_db", {blank: true}); num(".pan", "pan", {blank: true});
    $(".take", el).oninput = e => { const v = e.target.value.trim(); if (v === "") delete st.take; else if (!isNaN(+v)) st.take = Math.max(0, Math.round(+v)); schanged(); };
    const setStart = () => { delete st.at; delete st.gap; delete st.offset; const v = $(".sv", el).value.trim(); if (v !== "" && !isNaN(+v)) st[$(".sm", el).value] = +v; else if ($(".sm", el).value !== "offset") st[$(".sm", el).value] = 0; schanged(); };
    $(".sm", el).onchange = setStart; $(".sv", el).oninput = setStart;
    $(".up", el).onclick = () => { if (i) { [S.steps[i - 1], S.steps[i]] = [S.steps[i], S.steps[i - 1]]; drawSteps(); schanged(true); } };
    $(".dn", el).onclick = () => { if (i < S.steps.length - 1) { [S.steps[i + 1], S.steps[i]] = [S.steps[i], S.steps[i + 1]]; drawSteps(); schanged(true); } };
    $(".rm", el).onclick = () => { S.steps.splice(i, 1); drawSteps(); schanged(true); };
    $(".set", el).onclick = async () => { el.classList.toggle("open"); if (el.classList.contains("open") && !$(".ctl", el).children.length) await stepControls(st, $(".ctl", el)); };
    box.appendChild(el);
  });
}
async function stepControls(st, box) {
  const d = await describe(st.entry); st.macros = st.macros || {};
  const front = d.macros.filter(m => (m.ui || "front") === "front" && !/^(count|tempo)$/.test(m.name));
  if (!front.length) box.innerHTML = '<p class="hint">No controls.</p>';
  for (const m of front) {
    const label = m.label || m.name, val = st.macros[m.name];
    if (m.choices) dropdown(box, label, m.doc, m.choices, val ?? m.default, v => { st.macros[m.name] = v; schanged(); });
    else if (m.options) dropdown(box, label, m.doc, m.options, val ?? m.default_label ?? m.options[0], v => {
      if (v === m.default_label) delete st.macros[m.name]; else st.macros[m.name] = v; schanged(); });
    else slider(box, {label, doc: m.doc + " (double-click to reset)", lo: 0, hi: 1, value: typeof val === "number" ? val : m.default,
                      onchange: v => { st.macros[m.name] = +v.toFixed(3); schanged(); },
                      onreset: () => { delete st.macros[m.name]; schanged(); }});
  }
}
function schanged(now) {
  sPending = true;
  if (!$("#sauto") || !$("#sauto").checked) { if ($("#sstatus")) $("#sstatus").textContent = "changed: press Play"; return; }
  const play = !dragging;
  clearTimeout(sdebounce);
  sdebounce = setTimeout(() => srender(play), now ? 0 : 60);
}
function sreq() { return {sequence: Object.assign({}, S, {level: $("#slevel").value}), level: $("#slevel").value}; }
async function srender(play) {
  if (!S || !S.steps.length) { $("#sstatus").textContent = "Add a step: click a sound on the left."; const c = $("#seqwave"); c.getContext("2d").clearRect(0, 0, c.width, c.height); return; }
  const my = ++sqn; $("#sstatus").textContent = "rendering…"; clearTimeout(sdebounce);
  if (sinflight) sinflight.abort();
  const ctl = sinflight = new AbortController();
  try {
    const r = await api("/api/sequence/render", {...sreq(), supersede: true}, ctl.signal);
    if (my !== sqn || r.superseded) return;
    sLast = r.key; sPending = false; audio.src = r.url; audio.loop = false;
    const f = r.finish || {};
    const fresh = r.result_cached ? "from cache" : r.events_rendered ? `${r.events_rendered} new event${r.events_rendered > 1 ? "s" : ""} rendered, ${r.events_cached} reused` : `re-mixed ${r.events_cached} cached events`;
    $("#sstatus").textContent = `${r.seconds.toFixed(2)} s${r.channels === 2 ? " stereo" : ""} · ${r.events.length} events · ${fresh} in ${r.render_s} s` +
      (f.result !== undefined ? ` · ${f.result} LUFS, target ${f.target}` : "");
    drawSeqWave(r);
    if (play) audio.play().catch(() => {});
  } catch (e) { if (my === sqn && e.name !== "AbortError") $("#sstatus").textContent = "error: " + e.message; }
  finally { if (my === sqn) sinflight = null; }
}
function drawSeqWave(r) {
  const c = $("#seqwave"), g = c.getContext("2d"), W = c.width, H = c.height, bins = r.waveform;
  g.clearRect(0, 0, W, H); g.strokeStyle = "#e2e2df"; g.beginPath(); g.moveTo(0, H / 2); g.lineTo(W, H / 2); g.stroke();
  g.fillStyle = "#2a62d9"; const w = W / bins.length;
  bins.forEach(([lo, hi], i) => { const y1 = H / 2 - hi * H / 2, y2 = H / 2 - lo * H / 2; g.fillRect(i * w, y1, Math.max(1, w), Math.max(1, y2 - y1)); });
  g.font = "18px Segoe UI, sans-serif";
  const hues = ["#d9532a", "#2a9d5c", "#8a2ad9", "#d9a52a", "#2ab3d9", "#d92a8a"];
  for (const e of r.events) {
    const x = e.time / r.seconds * W; g.fillStyle = hues[(e.step - 1) % hues.length];
    g.fillRect(x, 0, 2, H); g.fillText(String(e.index), x + 4, 18);
  }
}
async function srun(path, body, done) {
  const msg = $("#smsg"); msg.className = "smsg"; msg.textContent = "Working…";
  try { msg.textContent = done(await api(path, body)); if (path.endsWith("save")) presetsList = await api("/api/sequences"); }
  catch (e) { msg.className = "smsg err"; msg.textContent = e.message; }
}

init().catch(e => { $("#main").innerHTML = `<div class="empty">Could not start: ${esc(e.message)}</div>`; });
</script>
</body>
